name: oil-seg-v4

seed: 42

data:
  image_size: 512

  channels:
    - VV
    - VH

model:
  architecture: unet
  encoder: resnet34
  encoder_weights: imagenet
  in_channels: 2
  classes: 1

training:
  batch_size: 16
  epochs: 60

  learning_rate: 0.0001
  weight_decay: 0.0001

  mixed_precision: true

loss:
  type: v4

  tversky_weight: 0.40
  dice_weight: 0.25
  focal_weight: 0.20
  boundary_weight: 0.10
  negative_weight: 0.05

  tversky_alpha: 0.30
  tversky_beta: 0.70

  focal_alpha: 0.60
  focal_gamma: 2.0

  negative_threshold: 0.30

scheduler:
  type: reduce_on_plateau

  mode: max
  patience: 4

  metric: val_dice

  factor: 0.5
  min_lr: 0.000005

early_stopping:
  patience: 8

evaluation:
  threshold: 0.50
  min_area: 50