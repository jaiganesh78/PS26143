name: oil-seg-v2

seed: 42

data:
  image_size: 512
  channels:
    - VV
    - VH

model:
  architecture: unet
  encoder: resnet34
  encoder_weights: imagenet
  in_channels: 2
  classes: 1

training:
  batch_size: 16
  epochs: 60
  learning_rate: 0.0001
  weight_decay: 0.0001
  mixed_precision: true

loss:
  type: v2

  focal_weight: 0.30
  dice_weight: 0.45
  boundary_weight: 0.15
  negative_weight: 0.10

  focal_alpha: 0.75
  focal_gamma: 2.0

  negative_threshold: 0.10

scheduler:
  type: reduce_on_plateau
  mode: max
  patience: 4
  metric: val_dice
  factor: 0.5
  min_lr: 0.000005

early_stopping:
  patience: 8

evaluation:
  threshold: 0.5