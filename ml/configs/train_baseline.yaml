name: oil-seg-v1

seed: 42

data:
  image_size: 512
  channels:
    - VV
    - VH

model:
  architecture: unet
  encoder: resnet34
  encoder_weights: imagenet
  in_channels: 2
  classes: 1

training:
  batch_size: 16
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  mixed_precision: true

loss:
  type: bce_dice
  bce_weight: 0.5
  dice_weight: 0.5

scheduler:
  type: reduce_on_plateau
  mode: max
  patience: 3
  metric: val_dice

early_stopping:
  patience: 5

evaluation:
  threshold: 0.5